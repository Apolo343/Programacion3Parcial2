<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito · LuckyTech</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/tema.js"></script>
</head>
<body>
  <header id="app-header"></header>

  <main class="contenedor">
    <h1>Tu carrito</h1>
    <p class="subtitulo" id="saludo"></p>

    <div id="aviso" class="aviso aviso--error" role="alert" hidden></div>
    <div id="lista" class="lista-carrito"></div>

    <div id="pie-carrito" hidden>
      <div class="resumen-total"><span>Total</span><span id="total"></span></div>
      <div class="acciones">
        <a class="btn btn--sec" href="productos.html">Seguir comprando</a>
        <button type="button" class="btn btn--sec" id="btn-vaciar">Vaciar carrito</button>
        <button type="button" class="btn" id="btn-confirmar">Finalizar compra</button>
      </div>
    </div>

    <dialog id="modal-confirmar">
      <h3>¿Confirmar la compra?</h3>
      <p id="modal-detalle"></p>
      <div class="acciones">
        <button type="button" class="btn btn--sec" id="modal-cancelar">Cancelar</button>
        <button type="button" class="btn" id="modal-aceptar">Confirmar</button>
      </div>
    </dialog>
  </main>

  <footer id="app-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/carrito.js"></script>
</body>
</html>
